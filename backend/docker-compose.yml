services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asthmatracker
      POSTGRES_USER: asthmauser
      POSTGRES_PASSWORD: asthmapassword
    ports:
      - "5432:5432"
    volumes:
      - asthma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asthmauser -d asthmatracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/asthmatracker
      DB_USERNAME: asthmauser
      DB_PASSWORD: asthmapassword
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  asthma-postgres-data:
