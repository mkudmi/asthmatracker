spring:
  application:
    name: asthma-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asthmatracker}
    username: ${DB_USERNAME:asthmauser}
    password: ${DB_PASSWORD:asthmapassword}
  flyway:
    enabled: true
    schemas: tracker
    default-schema: tracker
  jooq:
    sql-dialect: POSTGRES
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
