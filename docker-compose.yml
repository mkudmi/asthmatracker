services:
  postgres:
    image: postgres:17-alpine
    container_name: asthma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asthmatracker}
      POSTGRES_USER: ${POSTGRES_USER:-asthmauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asthmapassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - asthma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asthmauser} -d ${POSTGRES_DB:-asthmatracker}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asthmatracker}
      DB_USERNAME: ${POSTGRES_USER:-asthmauser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-asthmapassword}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    depends_on:
      - api
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  asthma-postgres-data:
